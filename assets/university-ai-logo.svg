<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">University AI Assistant logo</title>
  <desc id="desc">A U-shaped neural mark with four orbital arcs and connected circuit nodes.</desc>
  <defs>
    <linearGradient id="violetCyan" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
